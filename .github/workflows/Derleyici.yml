name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - "domains.json"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"

      - name: Eski Derlemeleri Temizle
        run: rm $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2

      # ! JitPack'in "com.github.recloudstream.gradle:gradle:master-SNAPSHOT" adresi
      # ! şu an bozuk metadata üretiyor (bkz: inconsistent module metadata /
      # ! "master-aster-SNAPSHOT" hatası) ve derlemeyi tamamen engelliyor.
      # ! Bu yüzden JitPack'e hiç güvenmiyoruz: eklentiyi doğrudan kaynağından
      # ! (recloudstream/gradle deposu) burada, her derlemede taze olarak
      # ! kendimiz derleyip yerel bir .jar olarak kullanıyoruz.
      - name: "CloudStream Gradle Eklentisini Kaynaktan Derle (JitPack'e bağımlı değil)"
        run: |
          git clone --depth 1 https://github.com/recloudstream/gradle.git /tmp/cs-gradle-plugin
          cd /tmp/cs-gradle-plugin
          chmod +x gradlew
          ./gradlew jar -x test --no-daemon
          mkdir -p $GITHUB_WORKSPACE/src/local-libs
          cp build/libs/*.jar $GITHUB_WORKSPACE/src/local-libs/cloudstream-gradle-plugin.jar

      - name: Eklentileri Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Derlemeleri Yükle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "${GITHUB_SHA}: eklentiler derlendi" || exit 0
          git push
